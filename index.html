<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gomoku</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { touch-action: manipulation; overflow: hidden; height: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    @keyframes last-move-blink {
      0%, 100% { background-color: transparent; }
      50% { background-color: rgba(50, 180, 80, 0.5); }
    }
    .last-move { animation: last-move-blink 1.5s ease-in-out infinite; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="js/main.js"></script>
</body>
</html>
